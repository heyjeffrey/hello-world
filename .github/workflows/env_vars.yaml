name: Xchange Environment Vars

on:
    workflow_dispatch:  # Manually trigger the workflow

env:    
    MY_VAR_2: ${{ env.MY_VAR}}    

jobs:
  Exch:
    runs-on: ubuntu-latest
    # read env var set in python
    steps:
      - uses: actions/checkout@v5        
